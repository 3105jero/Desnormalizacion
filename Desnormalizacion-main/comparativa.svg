<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="url(#bgGrad)" rx="16"/>

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="130" x2="900" y2="130"/>
    <line x1="0" y1="260" x2="900" y2="260"/>
    <line x1="0" y1="390" x2="900" y2="390"/>
    <line x1="300" y1="0" x2="300" y2="520"/>
    <line x1="600" y1="0" x2="600" y2="520"/>
  </g>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="700" letter-spacing="1">Normalización vs Desnormalización</text>
  <text x="450" y="64" text-anchor="middle" fill="#64748b" font-size="13">Comparativa de estrategias en diseño de bases de datos</text>

  <!-- Divider line -->
  <line x1="60" y1="78" x2="840" y2="78" stroke="#334155" stroke-width="1"/>

  <!-- === LEFT SIDE: NORMALIZADO === -->
  <text x="225" y="106" text-anchor="middle" fill="#60a5fa" font-size="16" font-weight="700">🔷 NORMALIZADO (OLTP)</text>

  <!-- Table: ventas -->
  <rect x="60" y="118" width="145" height="90" rx="8" fill="#1e3a5f" filter="url(#shadow)"/>
  <rect x="60" y="118" width="145" height="28" rx="8" fill="url(#blueGrad)"/>
  <rect x="60" y="138" width="145" height="8" rx="0" fill="url(#blueGrad)"/>
  <text x="132" y="137" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">ventas</text>
  <text x="75" y="162" fill="#94a3b8" font-size="10">🔑 id</text>
  <text x="75" y="177" fill="#94a3b8" font-size="10">📅 fecha</text>
  <text x="75" y="192" fill="#cbd5e1" font-size="10">🔗 id_cliente</text>
  <text x="75" y="207" fill="#cbd5e1" font-size="10">🔗 id_producto</text>

  <!-- Table: clientes -->
  <rect x="60" y="228" width="145" height="90" rx="8" fill="#1e3a5f" filter="url(#shadow)"/>
  <rect x="60" y="228" width="145" height="28" rx="8" fill="url(#blueGrad)"/>
  <rect x="60" y="248" width="145" height="8" rx="0" fill="url(#blueGrad)"/>
  <text x="132" y="247" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">clientes</text>
  <text x="75" y="272" fill="#94a3b8" font-size="10">🔑 id</text>
  <text x="75" y="287" fill="#e2e8f0" font-size="10">nombre</text>
  <text x="75" y="302" fill="#e2e8f0" font-size="10">ciudad</text>

  <!-- Table: productos -->
  <rect x="225" y="228" width="145" height="90" rx="8" fill="#1e3a5f" filter="url(#shadow)"/>
  <rect x="225" y="228" width="145" height="28" rx="8" fill="url(#blueGrad)"/>
  <rect x="225" y="248" width="145" height="8" rx="0" fill="url(#blueGrad)"/>
  <text x="297" y="247" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">productos</text>
  <text x="240" y="272" fill="#94a3b8" font-size="10">🔑 id</text>
  <text x="240" y="287" fill="#e2e8f0" font-size="10">nombre</text>
  <text x="240" y="302" fill="#e2e8f0" font-size="10">precio</text>

  <!-- Join arrows -->
  <line x1="132" y1="208" x2="132" y2="228" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>
  <polygon points="132,228 128,220 136,220" fill="#3b82f6" opacity="0.7"/>
  <line x1="205" y1="175" x2="225" y2="260" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>
  <polygon points="225,260 218,253 226,250" fill="#3b82f6" opacity="0.7"/>

  <!-- JOIN label -->
  <rect x="155" y="192" width="60" height="20" rx="4" fill="#1d4ed8" opacity="0.8"/>
  <text x="185" y="206" text-anchor="middle" fill="#bfdbfe" font-size="10" font-weight="600">3 JOINs</text>

  <!-- Pros/Cons Normalized -->
  <rect x="60" y="340" width="310" height="90" rx="8" fill="#0f2d4a" stroke="#1e3a5f" stroke-width="1"/>
  <text x="75" y="361" fill="#60a5fa" font-size="11" font-weight="700">Ventajas</text>
  <text x="75" y="378" fill="#94a3b8" font-size="10">✅  Sin redundancia de datos</text>
  <text x="75" y="393" fill="#94a3b8" font-size="10">✅  Integridad referencial</text>
  <text x="75" y="408" fill="#94a3b8" font-size="10">✅  Escrituras más rápidas</text>
  <text x="190" y="361" fill="#f87171" font-size="11" font-weight="700">Desventajas</text>
  <text x="190" y="378" fill="#94a3b8" font-size="10">❌  Lecturas lentas</text>
  <text x="190" y="393" fill="#94a3b8" font-size="10">❌  JOINs complejos</text>
  <text x="190" y="408" fill="#94a3b8" font-size="10">❌  Difícil escalar lecturas</text>

  <!-- Performance bar normalized -->
  <text x="75" y="448" fill="#64748b" font-size="10">Velocidad de lectura</text>
  <rect x="75" y="454" width="290" height="8" rx="4" fill="#1e293b"/>
  <rect x="75" y="454" width="110" height="8" rx="4" fill="#3b82f6"/>
  <text x="370" y="462" fill="#3b82f6" font-size="10" font-anchor="end">38%</text>

  <text x="75" y="478" fill="#64748b" font-size="10">Velocidad de escritura</text>
  <rect x="75" y="484" width="290" height="8" rx="4" fill="#1e293b"/>
  <rect x="75" y="484" width="240" height="8" rx="4" fill="#60a5fa"/>
  <text x="370" y="492" fill="#60a5fa" font-size="10">83%</text>

  <!-- === DIVIDER CENTER === -->
  <line x1="450" y1="88" x2="450" y2="506" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
  <circle cx="450" cy="290" r="20" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="450" y="294" text-anchor="middle" fill="#64748b" font-size="13" font-weight="700">VS</text>

  <!-- === RIGHT SIDE: DESNORMALIZADO === -->
  <text x="675" y="106" text-anchor="middle" fill="#34d399" font-size="16" font-weight="700">🟢 DESNORMALIZADO (OLAP)</text>

  <!-- Single merged table -->
  <rect x="490" y="118" width="370" height="190" rx="8" fill="#0d3328" filter="url(#shadow)"/>
  <rect x="490" y="118" width="370" height="28" rx="8" fill="url(#greenGrad)"/>
  <rect x="490" y="138" width="370" height="8" rx="0" fill="url(#greenGrad)"/>
  <text x="675" y="137" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">pedidos_reporte</text>

  <g fill="#94a3b8" font-size="10">
    <text x="510" y="162">🔑 id_pedido</text>
    <text x="510" y="177">📅 fecha</text>
    <text x="510" y="192">👤 cliente_nombre</text>
    <text x="510" y="207">🏙️ ciudad</text>
    <text x="510" y="222">📦 producto_nombre</text>
    <text x="510" y="237">💰 precio</text>
    <text x="510" y="252">🔢 cantidad</text>
    <!-- Right column indicators -->
    <text x="690" y="162" fill="#6ee7b7">← ventas</text>
    <text x="690" y="177" fill="#6ee7b7">← ventas</text>
    <text x="690" y="192" fill="#6ee7b7">← clientes</text>
    <text x="690" y="207" fill="#6ee7b7">← clientes</text>
    <text x="690" y="222" fill="#6ee7b7">← productos</text>
    <text x="690" y="237" fill="#6ee7b7">← productos</text>
    <text x="690" y="252" fill="#6ee7b7">← detalle</text>
  </g>

  <!-- No JOINs label -->
  <rect x="575" y="280" width="100" height="22" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="625" y="295" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700">0 JOINs ✨</text>

  <!-- Pros/Cons Denormalized -->
  <rect x="490" y="340" width="370" height="90" rx="8" fill="#052e20" stroke="#064e3b" stroke-width="1"/>
  <text x="505" y="361" fill="#34d399" font-size="11" font-weight="700">Ventajas</text>
  <text x="505" y="378" fill="#94a3b8" font-size="10">✅  Consultas ultra rápidas</text>
  <text x="505" y="393" fill="#94a3b8" font-size="10">✅  Ideal para BI / dashboards</text>
  <text x="505" y="408" fill="#94a3b8" font-size="10">✅  Menor complejidad de queries</text>
  <text x="670" y="361" fill="#f87171" font-size="11" font-weight="700">Desventajas</text>
  <text x="670" y="378" fill="#94a3b8" font-size="10">❌  Datos duplicados</text>
  <text x="670" y="393" fill="#94a3b8" font-size="10">❌  Escrituras más lentas</text>
  <text x="670" y="408" fill="#94a3b8" font-size="10">❌  Mayor uso de disco</text>

  <!-- Performance bar denormalized -->
  <text x="505" y="448" fill="#64748b" font-size="10">Velocidad de lectura</text>
  <rect x="505" y="454" width="340" height="8" rx="4" fill="#1e293b"/>
  <rect x="505" y="454" width="300" height="8" rx="4" fill="#10b981"/>
  <text x="848" y="462" fill="#10b981" font-size="10">88%</text>

  <text x="505" y="478" fill="#64748b" font-size="10">Velocidad de escritura</text>
  <rect x="505" y="484" width="340" height="8" rx="4" fill="#1e293b"/>
  <rect x="505" y="484" width="120" height="8" rx="4" fill="#34d399"/>
  <text x="848" y="492" fill="#34d399" font-size="10">35%</text>

  <!-- Bottom note -->
  <text x="450" y="514" text-anchor="middle" fill="#475569" font-size="10">💡 Elige según si tu sistema es transaccional (OLTP) o analítico (OLAP)</text>
</svg>
